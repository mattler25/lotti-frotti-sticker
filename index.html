  <h1>Frotti &amp; Lotti</h1>
  <p>Das Stickerbuch mit 24 Türchen</p>
  </header>
<section aria-labelledby="album"><h2 id="album">Dein Stickeralbum</h2><p id="status" aria-live="polite"></p><progress id="progress" max="24" value="0" aria-label="Freigeschaltete Sticker"></progress><div id="grid"></div></section>
<noscript>Aktiviere JavaScript, um das Stickerbuch zu öffnen.</noscript>
</main>
<dialog id="preview" aria-labelledby="sticker-title"><h2 id="sticker-title"></h2><img id="picture" width="512" height="512" alt=""><p id="caption"></p><p>Speichere das Bild und wähle es in WhatsApp beim Erstellen eines Stickers aus.</p><div class="actions"><a id="download" class="action">PNG speichern</a><form method="dialog"><button class="action close">Schließen</button></form></div></dialog>
<script>
'use strict';
// For real stickers, map a day to a same-site transparent PNG, e.g. 1: 'stickers/01.png'.
const stickerFiles = {};
const total = 24;
const dayLength = 86400000;
const storageKey = 'frotti-lotti-first-scan-v1';
const nfc = new URLSearchParams(location.search).get('start') === '1';
const localDay = () => {
  const now = new Date();
  return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / dayLength;
};
let firstDay = null;
let storageError = false;
try {
  const saved = localStorage.getItem(storageKey);
  if (saved !== null && Number.isSafeInteger(Number(saved))) firstDay = Number(saved);
  if (firstDay === null && nfc) {
    firstDay = localDay();
    localStorage.setItem(storageKey, String(firstDay));
    firstDay = Number(localStorage.getItem(storageKey));
  }
} catch {
  storageError = true;
}
const grid = document.querySelector('#grid');
const status = document.querySelector('#status');
const progress = document.querySelector('#progress');
const preview = document.querySelector('#preview');
const picture = document.querySelector('#picture');
const download = document.querySelector('#download');
const tiles = [];
function placeholder(day) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = day % 2 ? '#dbe5cc' : '#f2dfc0';
  ctx.beginPath();
  ctx.arc(256, 256, 224, 0, 2 * Math.PI);
  ctx.fill();
  ctx.textAlign = 'center';
  ctx.font = '150px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  ctx.fillText(day % 2 ? '🐸' : '🐭', 256, 288);
  ctx.fillStyle = '#234333';
  ctx.font = 'bold 29px system-ui';
  ctx.fillText('Platzhalter · Tag ' + day, 256, 366);
  return canvas.toDataURL('image/png');
}
function showSticker(day) {
  document.querySelector('#sticker-title').textContent = 'Sticker ' + day;
  const real = stickerFiles[day];
  const label = real ? 'Frotti & Lotti · Sticker ' + day : 'Platzhalter für Sticker ' + day;
  picture.alt = label;
  picture.src = real || placeholder(day);
  document.querySelector('#caption').textContent = label;
  download.href = picture.src;
  download.download = 'frotti-lotti-' + String(day).padStart(2, '0') + '.png';
  preview.showModal();
}
for (let day = 1; day <= total; day++) {
  const tile = document.createElement('button');
  tile.className = 'tile';
  tile.type = 'button';
  tile.innerHTML = '<span class="symbol" aria-hidden="true"></span><b>' + day + '</b><small></small>';
  tile.addEventListener('click', () => showSticker(day));
  grid.append(tile);
  tiles.push(tile);
}
function render() {
  const unlocked = firstDay === null ? 0 : Math.min(total, Math.max(1, localDay() - firstDay + 1));
  progress.value = unlocked;
  status.textContent = firstDay === null ? 'Scanne den NFC-Chip, um Türchen 1 zu öffnen.' : unlocked + ' von 24 offen' + (unlocked < total ? ' · Das nächste Türchen öffnet sich morgen.' : ' · Dein Album ist komplett!');
  if (storageError) status.textContent += ' Dieser Browser konnte deinen Start nicht dauerhaft speichern.';
  tiles.forEach((tile, index) => {
    const open = index < unlocked;
    tile.disabled = !open;
    tile.querySelector('.symbol').textContent = open ? (index % 2 ? '🐭' : '🐸') : '🔒';
    tile.querySelector('small').textContent = open ? (stickerFiles[index + 1] ? 'Sticker' : 'Platzhalter') : 'Geschlossen';
  });
}
render();
window.addEventListener('pageshow', render);
document.addEventListener('visibilitychange', render);
setInterval(render, 15000);
</script>
